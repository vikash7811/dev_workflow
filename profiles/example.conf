# Copy this file inside the external dev-workflow repository and edit values.

DEV_REPO="$HOME/path/to/project"

DEV_CPP_FORMATTER="git-clang-format-14"
DEV_CPP_EXTENSIONS="c,cc,cpp,cxx,h,hh,hpp,hxx"

DEV_PYTHON_FORMATTER="darker"

# Optional standalone CMake test configuration. For a pure ROS repository,
# omit these and dev-precheck will run tests through the ROS builder instead.
DEV_CMAKE_TEST_FLAG="-DBUILD_TESTING=ON"
DEV_GTEST_GLOB="*_tests"
DEV_TMP_BUILD_NAME="project_test_all"

# ROS1 or ROS2. Most values can be omitted and auto-detected when the repo is
# inside WORKSPACE/src. Pin version/setup in profiles when ROS1 and ROS2 are
# both installed on the same machine.
DEV_ROS_WORKSPACE="$HOME/ws"
DEV_ROS_VERSION="2"                     # 1 or 2
DEV_ROS_SETUP="/opt/ros/humble/setup.bash"
DEV_ROS_PACKAGE=""                      # empty = auto-discover repo packages
DEV_ROS_BUILDER="auto"                  # ROS1: catkin/catkin_make; ROS2: colcon

# Optional Git identity profile configured with dev-git-config. The identity
# file lives under ~/.config/dev-workflow, not in this repository.
DEV_GIT_PROFILE=""                         # e.g. personal

# Optional ROS1 Docker reproduction image. No vendor-specific default is used.
DEV_DOCKER_IMAGE=""                      # set your image when needed
